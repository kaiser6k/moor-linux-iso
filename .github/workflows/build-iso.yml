name: Build ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "live/**"
      - "scripts/build-moor.sh"
      - "scripts/stage-themes.sh"
      - "scripts/lib.sh"
      - "patches/**"
      - "iso-overrides/**"
      - ".github/workflows/build-iso.yml"
      - "scripts/idle-ram.py"
      - "scripts/guest-idle-ram.sh"
      - "scripts/vps-setup-nested-vm.sh"
  pull_request:
    paths:
      - "live/**"
      - "scripts/build-moor.sh"
      - "scripts/stage-themes.sh"
      - "scripts/lib.sh"
      - "patches/**"
      - "iso-overrides/**"
      - ".github/workflows/build-iso.yml"
      - "scripts/idle-ram.py"
      - "scripts/guest-idle-ram.sh"
      - "scripts/vps-setup-nested-vm.sh"

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rebuild: ${{ steps.decide.outputs.rebuild }}
      iso_run: ${{ steps.decide.outputs.iso_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether the ISO must be rebuilt
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          line=$(gh run list -R "$GITHUB_REPOSITORY" --workflow build-iso.yml --branch "$branch" \
            --status success --limit 1 --json databaseId,headSha \
            -q 'if length == 0 then "" else "\(.[0].databaseId) \(.[0].headSha)" end')
          rebuild=true
          iso_run=
          if [ -n "$line" ]; then
            id=${line%% *}
            sha=${line#* }
            echo "Previous successful Build ISO run $id at $sha"
            if git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              changed=$(git diff --name-only "$sha" HEAD -- \
                live scripts/build-moor.sh scripts/stage-themes.sh scripts/lib.sh \
                patches iso-overrides || true)
              if [ -z "$changed" ]; then
                echo "ISO inputs are unchanged. Reusing run $id."
                rebuild=false
                iso_run=$id
              else
                echo "ISO inputs changed:"
                printf '%s\n' "$changed"
              fi
            else
              echo "Commit $sha is not in this checkout. Rebuilding."
            fi
          else
            echo "No previous successful Build ISO run on ${branch}. Rebuilding."
          fi
          echo "rebuild=$rebuild" >> "$GITHUB_OUTPUT"
          echo "iso_run=$iso_run" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.rebuild == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # live-build needs chroot, mount and loop devices. The job itself stays on
    # the host so we can free the runner disk first; the build runs in a
    # privileged debian:trixie container (a job-level container would hide the
    # host filesystem, so cleanup could not run).
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Free host disk space
        run: |
          set -eux
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/share/miniconda \
            /usr/local/share/powershell \
            /usr/local/lib/node_modules \
            /opt/az \
            /usr/local/share/chromium \
            /usr/local/share/vcpkg \
            || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ISO in privileged debian:trixie
        run: |
          set -euo pipefail
          docker run --privileged --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            -e DEBIAN_FRONTEND=noninteractive \
            -e GITHUB_WORKSPACE=/work \
            -e GITHUB_SHA \
            -e GITHUB_REF \
            -e GITHUB_SERVER_URL \
            -e GITHUB_REPOSITORY \
            -e GITHUB_RUN_ID \
            debian:trixie \
            bash -lc '
              set -euo pipefail
              printf "Acquire::Retries \"10\";\nAcquire::http::Timeout \"30\";\n" > /etc/apt/apt.conf.d/80-retries
              apt-get update
              apt-get install -y --no-install-recommends \
                live-build debootstrap xorriso squashfs-tools \
                grub-efi-amd64-bin grub-pc-bin mtools dosfstools \
                git ca-certificates curl rsync xz-utils \
                sassc libxml2-utils glib2.0-bin libglib2.0-dev-bin \
                gtk-update-icon-cache sudo passwd
              df -h / || true
              git config --global --add safe.directory "$GITHUB_WORKSPACE"
              ./scripts/build-moor.sh
              ./scripts/stage-themes.sh
              mkdir -p "$GITHUB_WORKSPACE/out"
              cd live
              lb clean --purge || true
              ./auto-config.sh
              start=$(date +%s)
              echo "$start" > "$GITHUB_WORKSPACE/out/build-start.epoch"
              lb build 2>&1 | tee "$GITHUB_WORKSPACE/out/lb-build.log"
              end=$(date +%s)
              iso=$(ls ./*.iso | head -n1)
              name=$(basename "$iso")
              mv "$iso" "$GITHUB_WORKSPACE/out/$name"
              cd "$GITHUB_WORKSPACE/out"
              sha256sum "$name" > "$name.sha256"
              {
                echo "iso: $name"
                echo "size_bytes: $(stat -c %s "$name")"
                echo "size_human: $(du -h "$name" | cut -f1)"
                echo "sha256: $(cut -d" " -f1 "$name.sha256")"
                echo "build_seconds: $((end - start))"
                echo "commit: ${GITHUB_SHA}"
                echo "ref: ${GITHUB_REF}"
                echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
                echo "built_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              } > build-info.txt
              cat build-info.txt
              df -h / || true
            '

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: moor-linux-iso
          path: |
            out/*.iso
            out/*.sha256
            out/build-info.txt
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            out/lb-build.log
            out/build-info.txt
            live/build.log
          retention-days: 14
          if-no-files-found: ignore

  # Current main ISO, three idle samples. Runs in parallel with the image build.
  baseline-ram:
    needs: plan
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Reuse measurements from the previous ISO
        if: needs.plan.outputs.rebuild != 'true'
        run: |
          echo "ISO inputs are unchanged since Build ISO run ${{ needs.plan.outputs.iso_run }}."
          echo "Baseline medians stay the ones in docs/VPS-NESTED-VM.md from that run."

      - uses: actions/checkout@v4
        if: needs.plan.outputs.rebuild == 'true'

      - name: Resolve main build run
        if: needs.plan.outputs.rebuild == 'true'
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow build-iso.yml --branch main \
                 --status success --limit 1 --json databaseId -q '.[0].databaseId')
          echo "Testing baseline ISO from build run $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Download main ISO artifact
        if: needs.plan.outputs.rebuild == 'true'
        uses: actions/download-artifact@v4
        with:
          name: moor-linux-iso
          path: iso
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}

      - name: Install QEMU
        if: needs.plan.outputs.rebuild == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils python3
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          fi

      - name: Verify checksum
        if: needs.plan.outputs.rebuild == 'true'
        working-directory: iso
        run: sha256sum -c *.sha256

      - name: Idle RAM (baseline, 3 runs)
        if: needs.plan.outputs.rebuild == 'true'
        run: |
          iso=$(ls iso/*.iso | head -n1)
          python3 scripts/idle-ram.py --iso "$iso" --profile gnome --label baseline \
            --runs 3 --settle 120 --out idle-ram

      - name: Upload idle RAM raw output
        if: always() && needs.plan.outputs.rebuild == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: idle-ram-baseline
          path: idle-ram/
          retention-days: 14
          if-no-files-found: warn

  # GNOME-lean (default entry) and Xfce-lite on the ISO this workflow just built.
  idle-ram:
    needs: [plan, build]
    if: >
      always() &&
      needs.plan.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: gnome
            label: gnome-lean
          - profile: xfce
            label: xfce-lite
    steps:
      - name: Reuse measurements from the previous ISO
        if: needs.plan.outputs.rebuild != 'true'
        run: |
          echo "ISO inputs are unchanged since Build ISO run ${{ needs.plan.outputs.iso_run }}."
          echo "${{ matrix.label }} medians stay the ones in docs/VPS-NESTED-VM.md from that run."

      - uses: actions/checkout@v4
        if: needs.plan.outputs.rebuild == 'true'

      - name: Download ISO artifact
        if: needs.plan.outputs.rebuild == 'true'
        uses: actions/download-artifact@v4
        with:
          name: moor-linux-iso
          path: iso

      - name: Install QEMU
        if: needs.plan.outputs.rebuild == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils python3
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          fi

      - name: Verify checksum
        if: needs.plan.outputs.rebuild == 'true'
        working-directory: iso
        run: sha256sum -c *.sha256

      - name: Idle RAM (${{ matrix.label }}, 3 runs)
        if: needs.plan.outputs.rebuild == 'true'
        run: |
          iso=$(ls iso/*.iso | head -n1)
          python3 scripts/idle-ram.py --iso "$iso" --profile ${{ matrix.profile }} \
            --label ${{ matrix.label }} --runs 3 --settle 120 --out idle-ram

      - name: Upload idle RAM raw output
        if: always() && needs.plan.outputs.rebuild == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: idle-ram-${{ matrix.label }}
          path: idle-ram/
          retention-days: 14
          if-no-files-found: warn

  # Re-publish the previous ISO when this commit does not change the image,
  # so boot-test and script-test can download moor-linux-iso from this run.
  publish-iso:
    needs: [plan, build]
    if: >
      always() &&
      needs.plan.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download the previous ISO
        if: needs.plan.outputs.rebuild != 'true'
        uses: actions/download-artifact@v4
        with:
          name: moor-linux-iso
          path: iso
          run-id: ${{ needs.plan.outputs.iso_run }}
          github-token: ${{ github.token }}

      - name: Stage and verify the reused ISO
        if: needs.plan.outputs.rebuild != 'true'
        run: |
          set -eu
          mkdir -p flat
          find iso -type f \( -name '*.iso' -o -name '*.sha256' -o -name 'build-info.txt' \) -exec cp -t flat {} +
          (cd flat && sha256sum -c *.sha256)
          ls -l flat

      - name: Upload the reused ISO
        if: needs.plan.outputs.rebuild != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: moor-linux-iso
          path: |
            flat/*.iso
            flat/*.sha256
            flat/build-info.txt
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

      - name: This run built the ISO
        if: needs.plan.outputs.rebuild == 'true'
        run: echo "The build job uploaded moor-linux-iso."

  script-test:
    needs: [plan, build, publish-iso]
    if: always() && needs.publish-iso.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Download ISO
        uses: actions/download-artifact@v4
        with:
          name: moor-linux-iso
          path: iso

      - name: Shellcheck
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck -s bash scripts/vps-setup-nested-vm.sh

      - name: Dry run
        run: |
          set -euo pipefail
          iso=$(find iso -name '*.iso' -type f | head -n1)
          sha=$(find iso -name '*.sha256' -type f -print0 | xargs -0 cat | awk 'NR==1 { print $1; exit }')
          test -n "$iso"
          test -n "$sha"
          ./scripts/vps-setup-nested-vm.sh --dry-run --sha256 "$sha" "$iso" 2>&1 | tee dry.txt
          grep -F 'ssh -L ' dry.txt
          grep -F '127.0.0.1' dry.txt
          ./scripts/vps-setup-nested-vm.sh --dry-run --accel tcg --ram 2048 "$iso" 2>&1 | tee dry-tcg.txt
          grep -F 'WARNING:' dry-tcg.txt
          grep -F 'MOOR_ACCEL=tcg' dry-tcg.txt

      - name: Boot on TCG and on KVM when /dev/kvm is usable
        run: |
          set -euo pipefail
          iso=$(find iso -name '*.iso' -type f | head -n1)
          sha=$(find iso -name '*.sha256' -type f -print0 | xargs -0 cat | awk 'NR==1 { print $1; exit }')
          serial="$PWD/moor-serial.log"
          : > "$serial"
          have_kvm=0
          if [ -e /dev/kvm ] && sudo test -r /dev/kvm && sudo test -w /dev/kvm \
              && grep -E -q '(vmx|svm)' /proc/cpuinfo; then
            have_kvm=1
          fi
          echo "have_kvm=$have_kvm"
          cleanup() {
            sudo ./scripts/vps-setup-nested-vm.sh --destroy || true
          }
          trap cleanup EXIT
          assert_removed() {
            if sudo virsh dominfo moor >/dev/null 2>&1; then
              echo "domain moor still defined after --destroy" >&2
              exit 1
            fi
            if sudo ss -H -ltn 'sport = :5900' | grep -q ':5900'; then
              echo "port 5900 still open after --destroy" >&2
              exit 1
            fi
            iso_copy="/var/lib/libvirt/images/moor-nested/$(basename "$iso")"
            for path in \
              /var/lib/libvirt/images/moor-nested/moor.qcow2 \
              /var/lib/libvirt/images/moor-nested/vmlinuz \
              /var/lib/libvirt/images/moor-nested/initrd.img \
              /var/lib/libvirt/images/moor-nested/moor.xml \
              "$iso_copy" \
              /var/lib/moor-nested-vm/state
            do
              if sudo test -e "$path"; then
                echo "still present after --destroy: $path" >&2
                exit 1
              fi
            done
            if sudo test -d /var/lib/libvirt/images/moor-nested; then
              echo "image directory still exists after --destroy" >&2
              sudo ls -la /var/lib/libvirt/images/moor-nested >&2 || true
              exit 1
            fi
          }
          run_one() {
            accel=$1
            tries=$2
            ram=$3
            tag=$4
            : > "$serial"
            ram_args=()
            if [ -n "$ram" ]; then
              ram_args=(--ram "$ram")
            fi
            sudo ./scripts/vps-setup-nested-vm.sh \
              --accel "$accel" \
              "${ram_args[@]}" \
              --sha256 "$sha" \
              --serial-log "$serial" \
              "$iso" | tee "run-${tag}.log"
            grep -q "^MOOR_ACCEL=${accel}$" "run-${tag}.log"
            echo "--- listeners ---"
            sudo ss -H -ltn 'sport = :5900' | tee "listen-${tag}.txt"
            if grep -E '0\.0\.0\.0:5900|\*:5900|\[::\]:5900' "listen-${tag}.txt"; then
              echo "console is not localhost-only" >&2
              exit 1
            fi
            grep -q '127.0.0.1:5900' "listen-${tag}.txt"
            sudo virsh dumpxml moor > "domain-${tag}.xml"
            awk '/<graphics /,/<\/graphics>/' "domain-${tag}.xml" > "graphics-${tag}.txt"
            if grep -E "0\\.0\\.0\\.0|listen='::'|address='::'|passwd=" "graphics-${tag}.txt"; then
              echo "domain XML is not an unauthenticated localhost SPICE console" >&2
              exit 1
            fi
            grep -q "type='spice'" "graphics-${tag}.txt"
            grep -q '127.0.0.1' "graphics-${tag}.txt"
            grep -q "bus='virtio'" "domain-${tag}.xml"
            grep -q "<model type='virtio'" "domain-${tag}.xml"
            if [ "$accel" = tcg ]; then
              grep -q '<model fallback=.forbid.>qemu64</model>' "domain-${tag}.xml"
            fi
            if [ -n "$ram" ]; then
              kib=$((ram * 1024))
              grep -q "<memory unit='KiB'>${kib}</memory>" "domain-${tag}.xml"
            fi
            # libvirt dynamic ownership makes the serial log mode 0600
            # and owned by libvirt-qemu while the guest is running.
            i=0
            while [ "$i" -lt "$tries" ]; do
              if sudo grep -F -q 'moor login:' "$serial"; then
                echo "login prompt for ${tag} after $((i * 5))s"
                break
              fi
              if sudo grep -q 'Unable to find a medium' "$serial"; then
                echo "live medium was not found" >&2
                exit 1
              fi
              i=$((i + 1))
              sleep 5
            done
            sudo cp "$serial" "serial-${tag}.log" || true
            if ! sudo grep -F -q 'moor login:' "$serial"; then
              echo "timed out waiting for moor login: on ${tag}" >&2
              sudo tail -c 12000 "$serial" >&2 || true
              sudo virsh screenshot moor "shot-${tag}.ppm" || true
              sudo chown "$(id -u):$(id -g)" "shot-${tag}.ppm" "serial-${tag}.log" 2>/dev/null || true
              exit 1
            fi
            idle=0
            if [ -n "$ram" ]; then
              idle=1
            fi
            if ! sudo python3 scripts/moor-guest-probe.py "$serial" "$idle" "probe-${tag}.txt"; then
              echo "guest probe failed for ${tag}" >&2
              sudo tail -c 12000 "$serial" >&2 || true
              sudo cp "$serial" "serial-${tag}.log" || true
              sudo virsh screenshot moor "shot-${tag}.ppm" || true
              sudo chown "$(id -u):$(id -g)" "shot-${tag}.ppm" "serial-${tag}.log" "probe-${tag}.txt" 2>/dev/null || true
              exit 1
            fi
            sudo chown "$(id -u):$(id -g)" "probe-${tag}.txt"
            grep -q 'xfce4-session=yes' "probe-${tag}.txt"
            if [ -n "$ram" ]; then
              used=$(awk -F= '/^used_mib=/ { print $2 }' "probe-${tag}.txt")
              case "$used" in
                ''|*[!0-9]*) echo "idle used memory was not a number" >&2; exit 1 ;;
              esac
              if [ "$used" -lt 1 ]; then
                echo "idle used memory was ${used}" >&2
                exit 1
              fi
              {
                echo "ram_mib=${ram}"
                echo "accel=${accel}"
                echo "samples=1"
                echo "used_mib=${used}"
              } > "idle-used-${ram}.txt"
              echo "idle used ${used} MiB at ${ram} MiB (${accel}, 1 sample)"
            fi
            sudo virsh screenshot moor "shot-${tag}.ppm"
            sudo chown "$(id -u):$(id -g)" "shot-${tag}.ppm"
            test -s "shot-${tag}.ppm"
            sudo cp "$serial" "serial-${tag}.log"
            sudo chown "$(id -u):$(id -g)" "serial-${tag}.log"
            sudo chmod 0644 "serial-${tag}.log"
            sudo ./scripts/vps-setup-nested-vm.sh --destroy
            assert_removed
          }
          # TCG is the script path that uses qemu64. KVM, when the runner has
          # it, is the same script with --accel kvm. The 2304 and 2048 boots
          # are one sample each, not a median of three.
          run_one tcg 240 "" tcg
          if [ "$have_kvm" -eq 1 ]; then
            run_one kvm 120 "" kvm
            run_one kvm 120 2304 ram2304
            run_one kvm 120 2048 ram2048
          else
            run_one tcg 240 2304 ram2304
            run_one tcg 240 2048 ram2048
          fi

      - name: Upload script-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vps-setup-test
          path: |
            dry.txt
            dry-tcg.txt
            run-*.log
            listen-*.txt
            domain-*.xml
            graphics-*.txt
            serial-*.log
            shot-*.ppm
            probe-*.txt
            idle-used-*.txt
          retention-days: 14
          if-no-files-found: ignore
