name: Build ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "live/**"
      - "scripts/build-moor.sh"
      - "scripts/stage-themes.sh"
      - "scripts/lib.sh"
      - "patches/**"
      - "iso-overrides/**"
      - ".github/workflows/build-iso.yml"
      - "scripts/idle-ram.py"
      - "scripts/guest-idle-ram.sh"
  pull_request:
    paths:
      - "live/**"
      - "scripts/build-moor.sh"
      - "scripts/stage-themes.sh"
      - "scripts/lib.sh"
      - "patches/**"
      - "iso-overrides/**"
      - ".github/workflows/build-iso.yml"
      - "scripts/idle-ram.py"
      - "scripts/guest-idle-ram.sh"

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # live-build needs chroot, mount and loop devices. The job itself stays on
    # the host so we can free the runner disk first; the build runs in a
    # privileged debian:trixie container (a job-level container would hide the
    # host filesystem, so cleanup could not run).
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Free host disk space
        run: |
          set -eux
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/share/miniconda \
            /usr/local/share/powershell \
            /usr/local/lib/node_modules \
            /opt/az \
            /usr/local/share/chromium \
            /usr/local/share/vcpkg \
            || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ISO in privileged debian:trixie
        run: |
          set -euo pipefail
          docker run --privileged --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            -e DEBIAN_FRONTEND=noninteractive \
            -e GITHUB_WORKSPACE=/work \
            -e GITHUB_SHA \
            -e GITHUB_REF \
            -e GITHUB_SERVER_URL \
            -e GITHUB_REPOSITORY \
            -e GITHUB_RUN_ID \
            debian:trixie \
            bash -lc '
              set -euo pipefail
              printf "Acquire::Retries \"10\";\nAcquire::http::Timeout \"30\";\n" > /etc/apt/apt.conf.d/80-retries
              apt-get update
              apt-get install -y --no-install-recommends \
                live-build debootstrap xorriso squashfs-tools \
                grub-efi-amd64-bin grub-pc-bin mtools dosfstools \
                git ca-certificates curl rsync xz-utils \
                sassc libxml2-utils glib2.0-bin libglib2.0-dev-bin \
                gtk-update-icon-cache sudo passwd
              df -h / || true
              git config --global --add safe.directory "$GITHUB_WORKSPACE"
              ./scripts/build-moor.sh
              ./scripts/stage-themes.sh
              mkdir -p "$GITHUB_WORKSPACE/out"
              cd live
              lb clean --purge || true
              ./auto-config.sh
              start=$(date +%s)
              echo "$start" > "$GITHUB_WORKSPACE/out/build-start.epoch"
              lb build 2>&1 | tee "$GITHUB_WORKSPACE/out/lb-build.log"
              end=$(date +%s)
              iso=$(ls ./*.iso | head -n1)
              name=$(basename "$iso")
              mv "$iso" "$GITHUB_WORKSPACE/out/$name"
              cd "$GITHUB_WORKSPACE/out"
              sha256sum "$name" > "$name.sha256"
              {
                echo "iso: $name"
                echo "size_bytes: $(stat -c %s "$name")"
                echo "size_human: $(du -h "$name" | cut -f1)"
                echo "sha256: $(cut -d" " -f1 "$name.sha256")"
                echo "build_seconds: $((end - start))"
                echo "commit: ${GITHUB_SHA}"
                echo "ref: ${GITHUB_REF}"
                echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
                echo "built_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              } > build-info.txt
              cat build-info.txt
              df -h / || true
            '

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: moor-linux-iso
          path: |
            out/*.iso
            out/*.sha256
            out/build-info.txt
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            out/lb-build.log
            out/build-info.txt
            live/build.log
          retention-days: 14
          if-no-files-found: ignore

  # Current main ISO, three idle samples. Runs in parallel with the image build.
  baseline-ram:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Resolve main build run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow build-iso.yml --branch main \
                 --status success --limit 1 --json databaseId -q '.[0].databaseId')
          echo "Testing baseline ISO from build run $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Download main ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: moor-linux-iso
          path: iso
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils python3
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          fi

      - name: Verify checksum
        working-directory: iso
        run: sha256sum -c *.sha256

      - name: Idle RAM (baseline, 3 runs)
        run: |
          iso=$(ls iso/*.iso | head -n1)
          python3 scripts/idle-ram.py --iso "$iso" --profile gnome --label baseline \
            --runs 3 --settle 120 --out idle-ram

      - name: Upload idle RAM raw output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idle-ram-baseline
          path: idle-ram/
          retention-days: 14
          if-no-files-found: warn

  # GNOME-lean (default entry) and Xfce-lite on the ISO this workflow just built.
  idle-ram:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: gnome
            label: gnome-lean
          - profile: xfce
            label: xfce-lite
    steps:
      - uses: actions/checkout@v4

      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: moor-linux-iso
          path: iso

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils python3
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          fi

      - name: Verify checksum
        working-directory: iso
        run: sha256sum -c *.sha256

      - name: Idle RAM (${{ matrix.label }}, 3 runs)
        run: |
          iso=$(ls iso/*.iso | head -n1)
          python3 scripts/idle-ram.py --iso "$iso" --profile ${{ matrix.profile }} \
            --label ${{ matrix.label }} --runs 3 --settle 120 --out idle-ram

      - name: Upload idle RAM raw output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idle-ram-${{ matrix.label }}
          path: idle-ram/
          retention-days: 14
          if-no-files-found: warn
