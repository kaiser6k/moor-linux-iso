name: Boot test (QEMU)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build ISO run ID to test (blank = latest successful run on main)"
        required: false
        type: string
  workflow_run:
    workflows: ["Build ISO"]
    types: [completed]
  pull_request:

concurrency:
  group: boot-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  boot:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        firmware: [bios, uefi]
    steps:
      - uses: actions/checkout@v4

      - name: Resolve build run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            id="${{ github.event.workflow_run.id }}"
          elif [ -n "${{ inputs.run_id }}" ]; then
            id="${{ inputs.run_id }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            sha="${{ github.event.pull_request.head.sha }}"
            branch="${{ github.head_ref }}"
            id=
            for try in $(seq 1 90); do
              meta=$(gh run list -R "$GITHUB_REPOSITORY" --workflow build-iso.yml \
                --branch "$branch" --commit "$sha" --limit 1 \
                --json databaseId,status,conclusion)
              id=$(printf '%s' "$meta" | jq -r '.[0].databaseId // empty')
              status=$(printf '%s' "$meta" | jq -r '.[0].status // empty')
              conclusion=$(printf '%s' "$meta" | jq -r '.[0].conclusion // empty')
              echo "try ${try}: status=${status:-none} conclusion=${conclusion:-none} id=${id:-none}"
              art=
              if [ -n "$id" ]; then
                art=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/artifacts" \
                  --jq '[.artifacts[] | select(.name=="moor-linux-iso") | .id][0] // empty')
                if [ -n "$art" ]; then
                  echo "ISO artifact ${art} on run ${id}"
                  break
                fi
                if [ "$status" = "completed" ]; then
                  echo "Build ISO run ${id} finished ${conclusion} without moor-linux-iso" >&2
                  exit 1
                fi
              fi
              id=
              sleep 20
            done
            if [ -z "$id" ]; then
              echo "Timed out waiting for moor-linux-iso on ${branch} ${sha}" >&2
              exit 1
            fi
          else
            id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow build-iso.yml --branch main \
                   --status success --limit 1 --json databaseId -q '.[0].databaseId')
          fi
          echo "Testing ISO from build run $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: moor-linux-iso
          path: iso
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}

      - name: Install QEMU + OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf qemu-utils python3 xorriso tesseract-ocr
          ls /usr/share/OVMF/ || true
          # Enable KVM for the runner user if the host exposes it.
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          fi

      - name: Verify checksum
        working-directory: iso
        run: sha256sum -c *.sha256

      - name: Boot ${{ matrix.firmware }}
        run: |
          iso=$(ls iso/*.iso | head -n1)
          python3 scripts/boot-test.py --iso "$iso" --firmware ${{ matrix.firmware }} --out screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-screenshots-${{ matrix.firmware }}
          path: screenshots/
          retention-days: 14
          if-no-files-found: warn
